name: Verify Engine Code

on:
  pull_request:
  push:
    paths:
    - '.github/workflows/engine.yml'
    - 'package.json'
    - 'package-lock.json'
    - 'src/**'
    - 'tools/**'
    # The quest helper's table is checked here and is generated, not hand-edited, so a change to
    # it arrives on its own with nothing else to trigger this run.
    - 'data/quests.json'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - uses: actions/setup-node@v6
      with:
        node-version: 24
        cache: npm

    - run: npm ci

    - name: Lint
      run: npm run lint

    - name: Compile
      run: npx tsc --noEmit

    # Every setting in Environment reads the variable it is named after. A wrong name compiles,
    # lints, and holds a plausible value - the only symptom is that setting it in .env does
    # nothing. Two had drifted, one of them reachable from a line .env.example invites you to
    # uncomment.
    - name: Environment names
      run: npx tsx tools/envcheck.ts

    # The trading post's escrow rules against a real in-memory SQLite: every scenario adds up every
    # coin and item before and after, so a dupe or a void fails it whatever the code path.
    - name: Trading post
      run: npx tsx tools/tradingpostcheck.ts

    # Every row of the quest helper's table is a sentence a player reads in the game, and the
    # sentences are generated out of sim prose and server debugnames. This asserts the shapes that
    # cannot be right - a handle showing through, a step with no verb, "Use an item on Cauldron" -
    # over the whole shipped table rather than over a few examples.
    - name: Quest helper wording
      run: npx tsx tools/quest/WordingCheck.ts

  # ------------------------------------------------------------------ the generated table
  # IS data/quests.json STILL WHAT THE EXPORTER WRITES? It is generated out of the sim manifests
  # and the packed content, and it is also COMMITTED, because the client ships a copy of it as the
  # fallback its quest helper reads. So it is the one file here that can go stale while everything
  # compiles, lints and passes.
  #
  # IT DID, AND THIS JOB IS WHY. Four PRs that each regenerate it merged in sequence - #110, #122,
  # #124 and #128 - each exported against the tree as it stood when it was WRITTEN, so what landed
  # was whichever merged last. MONKEY MADNESS ended up two steps short and HEROES' QUEST (Phoenix
  # side) two items short. Every one of those PRs was green. The CLIENT caught it, from the far
  # side, after the fact, and then two main branches were red at once.
  #
  # A SEPARATE JOB RATHER THAN A STEP IN `verify`, because it needs the content repository and a
  # packed cache and `verify` deliberately needs neither - it stays a fast lint-and-compile that
  # runs against this repository alone. As its own job it runs in parallel and costs nothing on
  # the critical path.
  #
  # IT CAN GO RED ON A CONTENT MERGE. The exporter reads loc, npc and obj names out of the packed
  # cache, so renaming a loc in DeathPlateau-Content makes this table stale with no engine commit
  # at all. That is a true statement about the file rather than a false alarm, and it is the whole
  # reason the check exists - but it does mean a red here is sometimes nobody's PR. The failure
  # prints which content commit it measured against, for exactly that case.
  quest-table:
    name: The generated quest table is current
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v6
      with:
        path: engine

    - uses: actions/checkout@v6
      with:
        repository: coreysho/DeathPlateau-Content
        ref: 377-wip
        path: content

    - uses: actions/setup-node@v6
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: engine/package-lock.json

    - name: Install
      working-directory: engine
      run: npm ci

    # IN THE LOG, because a red verdict is unreadable without it: the same engine commit passes or
    # fails depending on which content it was built against.
    - name: Which content this run used
      working-directory: content
      run: git log --oneline -1

    - name: Pack the content
      working-directory: engine
      env:
        BUILD_SRC_DIR: ../content
        BUILD_VERIFY: 'false'
      run: npx tsx tools/pack/Build.ts

    - name: data/quests.json is what the exporter writes
      working-directory: engine
      env:
        BUILD_SRC_DIR: ../content
      run: npx tsx tools/quest/ExportCheck.ts
